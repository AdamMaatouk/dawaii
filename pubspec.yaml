name: pill_reminder_app

# Icon sources are made from assets/icon/app_icon.png by tool/make_icons.dart
# (artwork cropped and enlarged), then: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_full.png"
  # Android 8+ adaptive icon: artwork sized to the launcher's safe zone, so it
  # fills the round/squircle icon instead of being shrunk inside it.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

description: "Dawaii - medication reminders for older adults, in English and Arabic."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  intl: any
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt
    - assets/fonts/OFL-IBMPlexSansArabic.txt

  # Atkinson Hyperlegible Next (Braille Institute, designed for low vision) and
  # IBM Plex Sans Arabic. Both SIL Open Font License, see assets/fonts.
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
